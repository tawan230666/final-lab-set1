services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-taskboard}
      POSTGRES_USER:     ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-taskboard}"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks: [taskboard-net]

  auth-service:
    build: ./auth-service
    environment:
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${POSTGRES_DB:-taskboard}
      DB_USER:      ${POSTGRES_USER:-admin}
      DB_PASSWORD:  ${POSTGRES_PASSWORD:-secret123}
      JWT_SECRET:   ${JWT_SECRET:-engse207-local-dev-secret}
      JWT_EXPIRES:  ${JWT_EXPIRES:-1h}
      PORT:         3001
    depends_on:
      postgres: { condition: service_healthy }
    networks: [taskboard-net]
    restart: unless-stopped

  task-service:
    build: ./task-service
    environment:
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${POSTGRES_DB:-taskboard}
      DB_USER:      ${POSTGRES_USER:-admin}
      DB_PASSWORD:  ${POSTGRES_PASSWORD:-secret123}
      JWT_SECRET:   ${JWT_SECRET:-engse207-local-dev-secret}
      PORT:         3002
    depends_on:
      postgres:     { condition: service_healthy }
      auth-service: { condition: service_started }
    networks: [taskboard-net]
    restart: unless-stopped

  log-service:
    build: ./log-service
    environment:
      DB_HOST:      postgres
      DB_PORT:      5432
      DB_NAME:      ${POSTGRES_DB:-taskboard}
      DB_USER:      ${POSTGRES_USER:-admin}
      DB_PASSWORD:  ${POSTGRES_PASSWORD:-secret123}
      JWT_SECRET:   ${JWT_SECRET:-engse207-local-dev-secret}
      PORT:         3003
    depends_on:
      postgres: { condition: service_healthy }
    networks: [taskboard-net]
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks: [taskboard-net]

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - auth-service
      - task-service
      - log-service
      - frontend
    networks: [taskboard-net]
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  taskboard-net:
    driver: bridge
